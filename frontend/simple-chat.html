<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOF PSDG AI Chatbot — ผู้ช่วยอัจฉริยะ</title>
    <style>
        /* ============================================================================
           Design Tokens
           ============================================================================ */
        :root {
            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-primary-light: #eff6ff;
            --color-bg: #f3f4f6;
            --color-surface: #ffffff;
            --color-text-primary: #111827;
            --color-text-secondary: #6b7280;
            --color-text-muted: #9ca3af;
            --color-border: #e5e7eb;
            --color-user-msg: #2563eb;
            --color-user-msg-text: #ffffff;
            --color-assistant-msg: #ffffff;
            --color-assistant-msg-text: #111827;
            --color-system-msg: #f3f4f6;
            --color-system-msg-text: #6b7280;
            --color-success: #10b981;
            --color-error: #ef4444;
            --color-warning: #f59e0b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-pill: 9999px;
            --transition: all 0.2s ease;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                'Helvetica Neue', Arial, 'Noto Sans Thai', 'Sukhumwit', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-sans);
            background: var(--color-bg);
            color: var(--color-text-primary);
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================================
           Chat Container
           ============================================================================ */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            max-width: 100vw;
        }

        /* ============================================================================
           Header
           ============================================================================ */
        .chat-header {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--color-primary), #3b82f6);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        .header-info {
            display: flex;
            flex-direction: column;
        }

        .header-info h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 2px;
        }

        .header-info p {
            font-size: 12px;
            color: var(--color-text-secondary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 500;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-text-muted);
        }

        .status-dot.connected {
            background: var(--color-success);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .status-dot.disconnected {
            background: var(--color-error);
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
        }

        .status-dot.connecting {
            background: var(--color-warning);
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
        }

        .btn-reconnect {
            display: none;
            padding: 6px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-surface);
            color: var(--color-text-primary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-reconnect:hover {
            background: #f9fafb;
            border-color: var(--color-text-muted);
        }

        .btn-reconnect:hidden { display: none !important; }

        /* ============================================================================
           Messages Area
           ============================================================================ */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--color-text-muted); border-radius: 3px; }
        .chat-messages::-webkit-scrollbar-thumb:hover { background: var(--color-text-secondary); }

        /* ============================================================================
           Welcome Section
           ============================================================================ */
        .welcome-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 48px 20px;
        }

        .welcome-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--color-primary-light);
            color: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
        }

        .welcome-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-bottom: 28px;
            max-width: 420px;
        }

        /* Q&A Section */
        .qa-section {
            width: 100%;
            max-width: 640px;
        }

        .qa-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding-left: 4px;
        }

        .qa-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .qa-chip {
            padding: 8px 14px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-pill);
            background: var(--color-surface);
            color: var(--color-text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            user-select: none;
        }

        .qa-chip:hover {
            border-color: var(--color-primary);
            background: var(--color-primary-light);
            color: var(--color-primary);
            transform: translateY(-1px);
        }

        .qa-chip:active { transform: translateY(0); }

        /* ============================================================================
           Empty State
           ============================================================================ */
        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--color-text-muted);
            padding: 40px 20px;
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }

        /* ============================================================================
           Message Bubbles
           ============================================================================ */
        .message {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
            align-self: flex-end;
            margin-left: auto;
        }

        .message.assistant {
            align-self: flex-start;
            margin-right: auto;
        }

        .message.system {
            align-self: center;
            max-width: 100%;
            justify-content: center;
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: var(--color-primary);
            color: #ffffff;
        }

        .message.assistant .message-avatar {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            color: var(--color-primary);
        }

        .message-content {
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 14px;
            color: var(--color-text-primary);
            max-width: 100%;
            word-wrap: break-word;
            position: relative;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: var(--color-user-msg);
            color: var(--color-user-msg-text);
            border-bottom-right-radius: 2px;
        }

        .message.assistant .message-content {
            background: var(--color-assistant-msg);
            color: var(--color-assistant-msg-text);
            border: 1px solid var(--color-border);
            border-bottom-left-radius: 2px;
        }

        .message.system .message-content {
            background: var(--color-system-msg);
            color: var(--color-system-msg-text);
            border-radius: var(--radius-pill);
            font-size: 12px;
            padding: 6px 14px;
            max-width: 90%;
            text-align: center;
        }

        .message-time {
            font-size: 11px;
            color: var(--color-text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message.user .message-time {
            margin-left: 36px;
            text-align: right;
        }

        .message.assistant .message-time {
            margin-left: 36px;
        }

        /* ============================================================================
           Typing Indicator
           ============================================================================ */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 14px;
            background: var(--color-assistant-msg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            border-bottom-left-radius: 2px;
            max-width: 140px;
            font-size: 13px;
            color: var(--color-text-secondary);
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-text-secondary);
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        /* ============================================================================
           Input Area
           ============================================================================ */
        .chat-input-area {
            background: var(--color-surface);
            border-top: 1px solid var(--color-border);
            padding: 16px 20px;
            z-index: 20;
            box-shadow: 0 -4px 6px -1px rgb(0 0 0 / 0.05);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
            align-items: flex-end;
        }

        .textarea-container {
            flex: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            min-height: 44px;
            max-height: 140px;
            padding: 10px 16px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-pill);
            resize: none;
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--color-text-primary);
            outline: none;
            transition: var(--transition);
        }

        textarea:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea::placeholder { color: var(--color-text-muted); }

        .btn-send {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--color-primary);
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 72px;
        }

        .btn-send:hover:not(:disabled) {
            background: var(--color-primary-hover);
            transform: translateY(-1px);
        }

        .btn-send:active:not(:disabled) { transform: translateY(0); }

        .btn-send:disabled {
            background: #e5e7eb;
            color: var(--color-text-muted);
            cursor: not-allowed;
        }

        .btn-attach {
            width: 44px;
            height: 44px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-pill);
            background: var(--color-surface);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-attach:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
            background: var(--color-primary-light);
        }

        .btn-attach:disabled {
            color: var(--color-text-muted);
            border-color: var(--color-border);
            cursor: not-allowed;
        }

        /* ============================================================================
           Quick Questions (ด้านล่างพื้นที่ป้อนข้อความ)
           ============================================================================ */
        .quick-questions {
            background: var(--color-surface);
            border-top: 1px solid var(--color-border);
            padding: 16px 20px;
            z-index: 15;
        }

        .quick-questions-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            max-width: 900px;
            margin: 0 auto;
        }

        .quick-q-btn {
            padding: 10px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-surface);
            color: var(--color-text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            line-height: 1.4;
            white-space: normal;
        }

        .quick-q-btn:hover {
            border-color: var(--color-primary);
            background: var(--color-primary-light);
            color: var(--color-primary);
        }

        .quick-q-btn:active { transform: translateY(-1px); }

        .quick-q-btn .q-icon {
            font-size: 16px;
            margin-right: 6px;
        }

        /* ============================================================================
           Mobile Responsive
           ============================================================================ */
        @media (max-width: 640px) {
            .chat-header {
                padding: 10px 16px;
            }

            .header-info h1 { font-size: 15px; }
            .header-info p { font-size: 11px; }

            .status-indicator {
                font-size: 11px;
                padding: 5px 10px;
            }

            .btn-reconnect { padding: 5px 10px; font-size: 11px; }

            .chat-messages {
                padding: 16px;
                gap: 12px;
            }

            .message { max-width: 88%; }

            .welcome-section { padding: 32px 16px; }
            .welcome-icon { width: 56px; height: 56px; font-size: 24px; margin-bottom: 12px; }
            .welcome-title { font-size: 18px; }
            .welcome-subtitle { font-size: 13px; margin-bottom: 24px; }

            .qa-chips { gap: 6px; }
            .qa-chip { padding: 7px 12px; font-size: 12px; }

            .chat-input-area { padding: 12px 16px; }
            .input-wrapper { gap: 8px; }

            textarea { min-height: 40px; padding: 9px 14px; font-size: 14px; }

            .btn-send { padding: 9px 16px; min-width: 64px; font-size: 13px; }
            .btn-attach { width: 40px; height: 40px; }

            .quick-questions { padding: 12px 16px; }
            .quick-questions-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
            .quick-q-btn { padding: 8px 10px; font-size: 12px; }
        }

        @media (max-width: 480px) {
            .header-right { gap: 6px; }
            .btn-reconnect span:last-child { display: none; }
            .btn-reconnect { padding: 6px; }
        }

        /* ============================================================================
           Utility
           ============================================================================ */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header" role="banner">
            <div class="header-left">
                <div class="avatar" aria-label="MOF AI Assistant">MOF</div>
                <div class="header-info">
                    <h1>MOF PSDG AI Chatbot</h1>
                    <p>ผู้ช่วยอัจฉริยะสำหรับกลุ่มพัฒนาระบบบริหาร</p>
                </div>
            </div>
            <div class="header-right">
                <div class="status-indicator" id="statusIndicator" role="status" aria-live="polite">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">กำลังเชื่อมต่อ...</span>
                </div>
                <button class="btn-reconnect" id="btnReconnect" title="เชื่อมต่อใหม่" aria-label="เชื่อมต่อระบบใหม่">
                    <span>🔄</span>
                    <span>เชื่อมต่อใหม่</span>
                </button>
            </div>
        </header>

        <div class="chat-messages" id="messages" role="log" aria-label="ประวัติการสนทนา">
            <div class="welcome-section" id="welcomeSection">
                <div class="welcome-icon">💬</div>
                <div class="welcome-title">ยินดีต้อนรับค่ะ</div>
                <div class="welcome-subtitle">ถามคำถามเกี่ยวกับกลุ่มพัฒนาระบบบริหาร กระทรวงการคลัง ได้เลยค่ะ</div>

                <div class="qa-section">
                    <div class="qa-section-title">คำถามที่พบบ่อย</div>
                    <div class="qa-chips" id="qaChips"></div>
                </div>
            </div>

            <div class="empty-state" id="emptyState">
                <div class="icon">💭</div>
                <div>เริ่มต้นการสนทนาใหม่</div>
                <div style="font-size: 12px; margin-top: 4px;">พิมพ์คำถามของคุณในช่องด้านล่างค่ะ</div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <button class="btn-attach" id="btnAttach" title="แนบไฟล์" aria-label="แนบไฟล์" disabled>
                    <span>📎</span>
                </button>
                <div class="textarea-container">
                    <textarea id="messageInput" rows="1" placeholder="พิมพ์คำถามของท่านที่นี่..." aria-label="พิมพ์ข้อความ"></textarea>
                </div>
                <button class="btn-send" id="sendBtn" disabled title="ส่งข้อความ" aria-label="ส่งข้อความ">ส่ง</button>
            </div>
        </div>

        <!-- คำถามด่วน ด้านล่างพื้นที่ป้อนข้อความ -->
        <div class="quick-questions" id="quickQuestions">
            <div class="quick-questions-title">
                <span>⚡</span>
                คำถามด่วน
            </div>
            <div class="quick-questions-grid" id="quickQuestionsGrid"></div>
        </div>
    </div>

    <script>
        /* ============================================================================
           Configuration
           ============================================================================ */
        const API_BASE = 'http://127.0.0.1:8000';
        const STATUS_CHECK_INTERVAL = 30000; // ms

        /* ============================================================================
           DOM Elements
           ============================================================================ */
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const btnAttach = document.getElementById('btnAttach');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const btnReconnect = document.getElementById('btnReconnect');
        const welcomeSection = document.getElementById('welcomeSection');
        const emptyState = document.getElementById('emptyState');
        const qaChipsEl = document.getElementById('qaChips');
        const quickQuestionsGrid = document.getElementById('quickQuestionsGrid');

        /* ============================================================================
           State
           ============================================================================ */
        let conversationId = null;
        let isTyping = false;
        let typingDiv = null;
        let isConnected = false;
        let statusCheckTimer = null;

        /* ============================================================================
           Q&A Data (from https://km.mof.go.th — กลุ่มพัฒนาระบบบริหาร, สำนักงานปลัดกระทรวงการคลัง)
           ============================================================================ */
        const QA_DATA = [
            { q: "กลุ่มพัฒนาระบบบริหาร อยู่ภายใต้หน่วยงานใด", a: "สำนักงานปลัดกระทรวงการคลัง" },
            { q: "เว็บไซต์ของกลุ่มพัฒนาระบบบริหาร คืออะไร", a: "km.mof.go.th (เว็บจัดการความรู้ของกระทรวงการคลัง)" },
            { q: "อีเมลติดต่อกลุ่มพัฒนาระบบบริหาร", a: "saraban@mof.go.th" },
            { q: "เบอร์โทรศัพท์ติดต่อ", a: "02-126-5800 หรือ 02-273-9408" },
            { q: "สายด่วนกระทรวงการคลัง", a: "1689" },
            { q: "ที่อยู่กระทรวงการคลัง", a: "ถนนพระรามที่ 6 แขวงพญาไท เขตพญาไท กรุงเทพฯ 10400" },
            { q: "กลุ่มพัฒนาระบบบริหาร มีช่องทางโซเชียลมีเดียอะไรบ้าง", a: "เฟซบุ๊ก MoFNewsStationThailand, X @mofthailand, TikTok @mof_pr, ยูทูบช่อง UCmXYzOMYdNJItFYJfsoKfJQ" },
            { q: "กลุ่มพัฒนาระบบบริหาร มีภารกิจอะไรบ้าง", a: "จัดหมวดหมู่และเผยแพร่ความรู้ในหมวดต่างๆ เช่น นโยบายและยุทธศาสตร์, การบริหารทรัพยากรบุคคล, การกำกับตรวจสอบและการประเมิน, การพัฒนาระบบบริหาร, ข้อมูลด้านสารสนเทศการคลัง, เทคโนโลยีด้านสารสนเทศและการสื่อสาร, การป้องกันการทุจริต/คุณธรรม, กฎหมาย/ระเบียบ, การเงินและพัสดุ, งานทั่วไป" },
            { q: "เฟซบุ๊กของกระทรวงการคลังคืออะไร", a: "MoFNewsStationThailand" },
            { q: "X (ทวิตเตอร์) ของกระทรวงการคลังคืออะไร", a: "@mofthailand" },
            { q: "TikTok ของกระทรวงการคลังคืออะไร", a: "@mof_pr" },
        ];

        /* ============================================================================
           Quick Questions Data (คำถามด่วนด้านล่าง)
           ============================================================================ */
        const QUICK_QUESTIONS = [
            {
                category: "เกี่ยวกับหน่วยงาน",
                icon: "🏢",
                questions: [
                    "กลุ่มพัฒนาระบบบริหาร อยู่ภายใต้หน่วยงานใด",
                    "ที่อยู่กระทรวงการคลัง",
                    "สายด่วนกระทรวงการคลัง",
                ],
            },
            {
                category: "ติดต่อเรา",
                icon: "📞",
                questions: [
                    "อีเมลติดต่อกลุ่มพัฒนาระบบบริหาร",
                    "เบอร์โทรศัพท์ติดต่อ",
                    "เว็บไซต์ของกลุ่มพัฒนาระบบบริหาร คืออะไร",
                ],
            },
            {
                category: "ช่องทางออนไลน์",
                icon: "🌐",
                questions: [
                    "กลุ่มพัฒนาระบบบริหาร มีช่องทางโซเชียลมีเดียอะไรบ้าง",
                    "เฟซบุ๊กของกระทรวงการคลังคืออะไร",
                    "TikTok ของกระทรวงการคลังคืออะไร",
                ],
            },
            {
                category: "ภารกิจ",
                icon: "📋",
                questions: [
                    "กลุ่มพัฒนาระบบบริหาร มีภารกิจอะไรบ้าง",
                    "X (ทวิตเตอร์) ของกระทรวงการคลังคืออะไร",
                ],
            },
        ];

        /* ============================================================================
           Connection Status
           ============================================================================ */
        function setStatus(connected) {
            isConnected = connected;
            if (connected) {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'ระบบพร้อมใช้งาน';
                statusIndicator.style.borderColor = 'var(--color-success)';
                btnReconnect.style.display = 'none';
                updateSendButton();
            } else {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'ไม่สามารถเชื่อมต่อระบบ';
                statusIndicator.style.borderColor = 'var(--color-error)';
                btnReconnect.style.display = 'flex';
                sendBtn.disabled = true;
            }
        }

        async function checkStatus() {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);
                const res = await fetch(`${API_BASE}/health`, {
                    signal: controller.signal,
                    cache: 'no-cache',
                });
                clearTimeout(timeout);
                setStatus(res.ok);
            } catch (e) {
                setStatus(false);
            }
        }

        function startStatusPolling() {
            if (statusCheckTimer) clearInterval(statusCheckTimer);
            statusCheckTimer = setInterval(checkStatus, STATUS_CHECK_INTERVAL);
        }

        btnReconnect.addEventListener('click', () => {
            setStatus(false); // show reconnecting state briefly
            checkStatus();
        });

        /* ============================================================================
           Message Helpers
           ============================================================================ */
        function formatTime() {
            return new Date().toLocaleTimeString('th-TH', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false,
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function removeWelcome() {
            if (welcomeSection && welcomeSection.parentNode) {
                welcomeSection.remove();
            }
        }

        function showEmptyState() {
            if (emptyState) emptyState.style.display = 'flex';
        }

        function hideEmptyState() {
            if (emptyState) emptyState.style.display = 'none';
        }

        function addMessage(role, text, options = {}) {
            const { autoScroll = true, temp = false } = options;

            const div = document.createElement('div');
            div.className = `message ${role}`;
            if (temp) div.classList.add('temp');

            const timeStr = formatTime();
            let avatar = '🤖';
            if (role === 'user') avatar = '👤';
            if (role === 'system') avatar = 'ℹ️';

            div.innerHTML = `
                <div class="message-avatar" aria-hidden="true">${avatar}</div>
                <div>
                    <div class="message-content">${escapeHtml(text)}</div>
                    <div class="message-time">${timeStr}</div>
                </div>
            `;

            // Remove welcome / show empty state logic
            if (role === 'user' || role === 'assistant') {
                removeWelcome();
                hideEmptyState();
            }

            messagesEl.appendChild(div);
            if (autoScroll) scrollToBottom();
            return div;
        }

        function addSystemMessage(text) {
            return addMessage('system', text);
        }

        /* ============================================================================
           Typing Indicator
           ============================================================================ */
        function showTyping() {
            if (typingDiv) return;
            typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant typing temp';
            typingDiv.innerHTML = `
                <div class="message-avatar" aria-hidden="true">🤖</div>
                <div class="typing-indicator" role="status" aria-label="กำลังพิมพ์ตอบ...">
                    <span class="sr-only">กำลังพิมพ์ตอบ...</span>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            messagesEl.appendChild(typingDiv);
            scrollToBottom();
        }

        function hideTyping() {
            if (typingDiv) {
                typingDiv.remove();
                typingDiv = null;
            }
        }

        /* ============================================================================
           Q&A Chips
           ============================================================================ */
        function renderQAChips() {
            if (!QA_DATA.length || !qaChipsEl) return;
            QA_DATA.forEach((item) => {
                const chip = document.createElement('div');
                chip.className = 'qa-chip';
                chip.textContent = item.q;
                chip.setAttribute('role', 'button');
                chip.setAttribute('tabindex', '0');
                chip.setAttribute('aria-label', item.q);
                chip.onclick = () => selectQA(item.q);
                chip.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        selectQA(item.q);
                    }
                };
                qaChipsEl.appendChild(chip);
            });
        }

        function selectQA(question) {
            inputEl.value = question;
            inputEl.style.height = 'auto';
            inputEl.style.height = inputEl.scrollHeight + 'px';
            updateSendButton();
            inputEl.focus();
        }

        /* ============================================================================
           Quick Questions (คำถามด่วนด้านล่าง)
           ============================================================================ */
        function renderQuickQuestions() {
            if (!QUICK_QUESTIONS.length || !quickQuestionsGrid) return;

            QUICK_QUESTIONS.forEach((cat) => {
                // สร้างหัวข้อหมวดหมู่
                const catHeader = document.createElement('div');
                catHeader.style.cssText = 'font-size:11px; font-weight:700; color:var(--color-text-muted); text-transform:uppercase; letter-spacing:0.05em; margin:12px 0 6px 0; padding-left:2px;';
                catHeader.textContent = cat.category;
                quickQuestionsGrid.appendChild(catHeader);

                cat.questions.forEach((q) => {
                    const btn = document.createElement('button');
                    btn.className = 'quick-q-btn';
                    btn.type = 'button';
                    btn.innerHTML = `<span class="q-icon">${cat.icon}</span>${q}`;
                    btn.onclick = () => selectQuickQuestion(q);
                    quickQuestionsGrid.appendChild(btn);
                });
            });
        }

        function selectQuickQuestion(question) {
            inputEl.value = question;
            inputEl.style.height = 'auto';
            inputEl.style.height = inputEl.scrollHeight + 'px';
            updateSendButton();
            inputEl.focus();
            // ถ้าระบบพร้อม ให้ส่งข้อความทันที
            if (isConnected && !isTyping) {
                sendMessage();
            }
        }

        /* ============================================================================
           Q&A Fallback (local answers before calling API)
           ============================================================================ */
        function findQAAnswer(text) {
            return QA_DATA.find((item) =>
                item.q === text || text.includes(item.q)
            );
        }

        /* ============================================================================
           Send Message
           ============================================================================ */
        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isTyping || !isConnected) return;

            // Q&A fallback — answer locally without hitting API
            const qaMatch = findQAAnswer(text);
            if (qaMatch) {
                inputEl.value = '';
                inputEl.style.height = 'auto';
                updateSendButton();
                addMessage('user', text);
                addMessage('assistant', qaMatch.a);
                return;
            }

            // Clear input
            inputEl.value = '';
            inputEl.style.height = 'auto';
            updateSendButton();

            // Add user message
            addMessage('user', text);

            // Show typing indicator
            isTyping = true;
            updateSendButton();
            showTyping();

            try {
                const body = { message: text };
                if (conversationId) body.conversation_id = conversationId;

                const res = await fetch(`${API_BASE}/api/chat/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                hideTyping();
                isTyping = false;
                updateSendButton();

                if (res.ok) {
                    const data = await res.json();
                    conversationId = data.conversation_id || data.id || conversationId;
                    addMessage('assistant', data.response || data.message || 'ไม่มีคำตอบจากระบบ');
                } else {
                    addSystemMessage('ขออภัยค่ะ เกิดข้อผิดพลาดจากระบบ กรุณาลองใหม่อีกครั้ง');
                }
            } catch (e) {
                hideTyping();
                isTyping = false;
                updateSendButton();
                addSystemMessage('ไม่สามารถเชื่อมต่อกับระบบได้ในขณะนี้ กรุณาลองใหม่อีกครั้ง');
            }
        }

        function updateSendButton() {
            const hasText = inputEl.value.trim().length > 0;
            sendBtn.disabled = !hasText || isTyping || !isConnected;
        }

        /* ============================================================================
           Input Handling
           ============================================================================ */
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = inputEl.scrollHeight + 'px';
            updateSendButton();
        });

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        btnAttach.addEventListener('click', () => {
            // Placeholder for future file attachment feature
            // const fileInput = document.createElement('input');
            // fileInput.type = 'file';
            // fileInput.click();
        });

        /* ============================================================================
           Initialize
           ============================================================================ */
        function init() {
            renderQAChips();
            renderQuickQuestions();
            checkStatus();
            startStatusPolling();
        }

        init();
    </script>
</body>
